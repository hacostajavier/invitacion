<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Mi Invitación</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="escenario">

        <div class="libro" id="libro">

            <!-- CONTRAPORTADA -->
            <div class="hoja contraportada">
                <div class="cara">
                    <img src="imagenes/contraportada.jpg"
                         alt="Contraportada">
                </div>

                <div class="reverso"></div>
            </div>


            <!-- PÁGINA 3 -->
            <div class="hoja" data-pagina="3">

                <div class="cara">
                    <img src="imagenes/pagina3.jpg"
                         alt="Página 3">
                </div>

                <div class="reverso"></div>

            </div>


            <!-- PÁGINA 2 -->
            <div class="hoja" data-pagina="2">

                <div class="cara">
                    <img src="imagenes/pagina2.jpg"
                         alt="Página 2">
                </div>

                <div class="reverso"></div>

            </div>


            <!-- PÁGINA 1 -->
            <div class="hoja" data-pagina="1">

                <div class="cara">
                    <img src="imagenes/pagina1.jpg"
                         alt="Página 1">
                </div>

                <div class="reverso"></div>

            </div>


            <!-- PORTADA -->
            <div class="hoja portada" id="portada">

                <div class="cara">

                    <img src="imagenes/portada.jpg"
                         alt="Portada">

                </div>

                <div class="reverso"></div>

            </div>

        </div>

    </div>


    <script src="libro.js"></script>

</html>
